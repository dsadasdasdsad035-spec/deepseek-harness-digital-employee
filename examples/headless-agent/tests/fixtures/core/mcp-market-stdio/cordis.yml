- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: credentials-local
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    path: !!js process.env.DSH_MCP_FIXTURE_CREDENTIALS
    watch: false

- id: mcp-client
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    mode: manager

- id: mcp-market
  name: '@deepseek-ai/dsh-mcp-market'
  config:
    installRoot: !!js process.env.DSH_MCP_FIXTURE_INSTALL_ROOT
    trustedPublishers: !!js JSON.parse(process.env.DSH_MCP_FIXTURE_TRUSTED_PUBLISHERS)
