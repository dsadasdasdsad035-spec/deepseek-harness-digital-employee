- id: mock-llm
  name: './mock-llm.ts'

- id: agent-default-model
  name: '@qq296629801/dsh-agent-default-model'
  config:
    provider: digital-employee-mock
    model: digital-employee-mock

- id: agent-spine
  name: '@qq296629801/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    skills:
      filesystem:
        dshHome: './.dsh-home'

- id: attachment-local
  name: '@qq296629801/dsh-attachment-local'
  config:
    dshHome: './.dsh-home'

- id: credentials-local
  name: '@qq296629801/dsh-credentials-local'
  config:
    path: !!js process.env.DSH_HOOKS_FIXTURE_CREDENTIALS
    watch: false

- id: subprocess-local
  name: '@qq296629801/dsh-subprocess-local'

- id: bash-local
  name: '@qq296629801/dsh-bash-local'

- id: agent-presets
  name: '@qq296629801/dsh-agent-presets'
  config:
    default: digital-employee-minimal
    includeUserRoot: false
    roots:
      - path: !!js process.env.DSH_DIGITAL_EMPLOYEE_PRESET_ROOT
        trust: system

- id: digital-employees
  name: '@qq296629801/dsh-digital-employee'

- id: example-template
  name: './template.ts'

- id: digital-employee-file
  name: '@qq296629801/dsh-digital-employee-file'
  config:
    path: './digital-employees.json'

- id: subagents
  name: '@qq296629801/dsh-subagent'

- id: fixture-subagent-provider
  name: '../digital-employee-agent/subagent-provider.ts'

- id: system-prompt
  name: '@qq296629801/dsh-system-prompt'

- id: tools
  name: '@qq296629801/dsh-tools'

- id: hooks-market
  name: '@qq296629801/dsh-hooks-market'
  config:
    installRoot: !!js process.env.DSH_HOOKS_FIXTURE_INSTALL_ROOT
    trustedPublishers: !!js JSON.parse(process.env.DSH_HOOKS_FIXTURE_TRUSTED_PUBLISHERS)
    allowUnsignedPackages: false

- id: digital-employee-agent
  name: '@qq296629801/dsh-digital-employee-agent'

- id: digital-employee-management
  name: '../digital-employee-agent/management.ts'
