# Assembled keyless fixture for the company console remotes: companies,
# departments, employee-instance bindings, the promotional-image pipeline, and
# the live busy/idle floor projection, over the real digital employee store,
# attachment admission, and session persistence — with a stubbed live-agent
# registry (this process never runs an employee agent).

- id: digital-employees
  name: '@qq296629801/dsh-digital-employee'

- id: company-console-template
  name: './template.ts'

- id: digital-employee-file
  name: '@qq296629801/dsh-digital-employee-file'
  config:
    path: './digital-employees.json'

- id: company
  name: '@qq296629801/dsh-company'

- id: company-file
  name: '@qq296629801/dsh-company-file'
  config:
    path: './companies.json'

- id: llm
  name: '@qq296629801/dsh-llm'

- id: system-prompt
  name: '@qq296629801/dsh-system-prompt'

- id: tools
  name: '@qq296629801/dsh-tools'

- id: agent
  name: '@qq296629801/dsh-agent'

- id: agent-loop
  name: '@qq296629801/dsh-agent-loop'

- id: sessions
  name: '@qq296629801/dsh-session'

- id: session-persistence-jsonl
  name: '@qq296629801/dsh-session-persistence-jsonl'
  config:
    root: './sessions-root'
    compression: none

- id: attachment-local
  name: '@qq296629801/dsh-attachment-local'
  config:
    dshHome: './.dsh-home'

- id: company-management
  name: '@qq296629801/dsh-host-company-management'

- id: company-console-group-stub
  name: './group-stub.ts'

- id: company-group-chat
  name: '@qq296629801/dsh-host-company-group-chat'
  config:
    pollIntervalMs: 500
